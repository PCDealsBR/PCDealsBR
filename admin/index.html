<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — PCDeals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="logo" style="justify-content:center;margin-bottom:28px">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">PCDeals Admin</span>
      </div>
      <div id="loginError" class="form-error" style="display:none"></div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="admin@exemplo.com" />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" />
          Lembrar e-mail
        </label>
      </div>
      <button id="btnLogin" class="btn-primary">Entrar</button>
    </div>
  </div>

  <div id="adminPanel" style="display:none">
    <header>
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">PCDeals <span style="color:var(--text3);font-weight:400">/ Admin</span></span>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" id="themeToggle"><span class="theme-icon">🌙</span></button>
          <a href="../index.html" class="btn-outline">← Site</a>
          <button id="btnLogout" class="btn-outline">Sair</button>
        </div>
      </div>
    </header>

    <div class="admin-body container">

      <!-- FORM -->
      <section class="admin-card form-card">
        <h2 id="formTitle">Adicionar promoção</h2>
        <div id="formMsg" class="form-msg" style="display:none"></div>
        <div class="form-grid">
          <div class="form-group span2">
            <label>Título do produto *</label>
            <input type="text" id="fTitle" placeholder="Ex: RTX 4060 Ti 8GB ASUS Dual" />
          </div>
          <div class="form-group">
            <label>Loja *</label>
            <input type="text" id="fStore" list="storesList" placeholder="KaBuM!, Pichau..." />
            <datalist id="storesList"></datalist>
          </div>
          <div class="form-group">
            <label>Categoria *</label>
            <select id="fCategory">
              <option value="">Selecione</option>
              <option value="gpu">GPU</option>
              <option value="cpu">CPU</option>
              <option value="ram">RAM</option>
              <option value="storage">SSD / HDD</option>
              <option value="monitor">Monitor</option>
              <option value="keyboard">Teclado</option>
              <option value="mouse">Mouse</option>
              <option value="headset">Headset</option>
              <option value="psu">Fonte</option>
              <option value="case">Gabinete</option>
              <option value="cooling">Cooler</option>
              <option value="notebook">Notebook</option>
              <option value="other">Outros</option>
            </select>
          </div>
          <div class="form-group">
            <label>Preço original (R$)</label>
            <input type="number" id="fPriceOld" placeholder="1299.99" step="0.01" min="0" />
          </div>
          <div class="form-group">
            <label>Preço promocional (R$) *</label>
            <input type="number" id="fPriceNew" placeholder="999.99" step="0.01" min="0" />
          </div>
          <div class="form-group span2">
            <label>Parcelamento</label>
            <input type="text" id="fInstallment" placeholder="Ex: 10x R$ 99,99 sem juros" />
          </div>
          <div class="form-group span2">
            <label>URL da promoção *</label>
            <input type="url" id="fUrl" placeholder="https://kabum.com.br/produto/..." />
          </div>
          <div class="form-group span2">
            <label>URL da imagem</label>
            <input type="url" id="fImageUrl" placeholder="https://..." />
          </div>
          <div class="form-group span2 expiry-group">
            <label>⏰ Válida até</label>
            <div class="expiry-row">
              <input type="datetime-local" id="fExpiresAt" />
              <div class="expiry-shortcuts">
                <button type="button" class="btn-shortcut" data-hours="24">+1 dia</button>
                <button type="button" class="btn-shortcut" data-hours="48">+2 dias</button>
                <button type="button" class="btn-shortcut" data-hours="72">+3 dias</button>
                <button type="button" class="btn-shortcut" data-hours="168">+1 semana</button>
                <button type="button" class="btn-shortcut" data-hours="720">+1 mês</button>
                <button type="button" class="btn-clear-expiry">Sem expiração</button>
              </div>
            </div>
            <p class="expiry-hint">A promoção some do site automaticamente quando essa data passar.</p>
          </div>
        </div>
        <div class="form-actions">
          <button id="btnCancelEdit" class="btn-outline" style="display:none">Cancelar</button>
          <button id="btnSave" class="btn-primary">Salvar promoção</button>
        </div>
      </section>

      <!-- TABLE -->
      <section class="admin-card">
        <div class="table-header">
          <h2>Promoções cadastradas</h2>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <label class="toggle-label">
              <input type="checkbox" id="showExpired" />
              Mostrar expiradas
            </label>
            <input type="text" id="adminSearch" placeholder="Buscar..." class="admin-search" />
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Produto</th><th>Loja</th><th>Preço</th><th>Desconto</th><th>Expira em</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="dealsTableBody">
              <tr><td colspan="7" style="text-align:center;color:var(--text3);padding:24px">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    const t = document.getElementById("themeToggle");
    const saved = localStorage.getItem("theme") || "dark";
    document.documentElement.setAttribute("data-theme", saved);
    if (t) t.querySelector(".theme-icon").textContent = saved === "dark" ? "🌙" : "☀️";
    if (t) t.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      t.querySelector(".theme-icon").textContent = next === "dark" ? "🌙" : "☀️";
      localStorage.setItem("theme", next);
    });
  </script>
  <script type="module" src="admin.js"></script>
</body>
</html>
